spring.application.name=ai-mentor

# =====================================================
# DATABASE
# =====================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# =====================================================
# JPA / HIBERNATE
# =====================================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# =====================================================
# GROQ AI
# =====================================================

spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=openai/gpt-oss-20b

# =====================================================
# SERVER
# =====================================================

server.port=${PORT:8080}

# IMPORTANT FOR RAILWAY HTTPS / OAUTH2
server.forward-headers-strategy=framework

# =====================================================
# JWT
# =====================================================

jwt.secret=${JWT_SECRET}

# =====================================================
# GOOGLE OAUTH2
# =====================================================

spring.security.oauth2.client.registration.google.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# =====================================================
# GITHUB OAUTH2
# =====================================================

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

# =====================================================
# PRODUCTION LOGGING
# =====================================================

logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.security.oauth2=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.web.client=WARN
logging.level.org.hibernate=WARN

# =====================================================
# ERROR RESPONSE
# =====================================================

server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false